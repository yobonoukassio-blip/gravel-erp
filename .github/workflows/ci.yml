name: ci
on:
  push:
    branches: [master, main]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint workspaces (--max-warnings=0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run lint -- --max-warnings=0

  build:
    name: Build workspaces
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gravel/shared-types build
      - run: pnpm --filter @gravel/api build
      - run: pnpm --filter @gravel/web build

  ci-gate:
    name: CI gate (branch protection check)
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, build]
    steps:
      - name: Verify lint + build green
        run: |
          if [[ "${{ needs.lint.result }}" != "success" \
             || "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::lint or build failed — blocking merge."
            exit 1
          fi
