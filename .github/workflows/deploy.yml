name: deploy
on:
  push:
    branches: [main]

jobs:
  # ── 1. Migrations Supabase ──────────────────────────────────────────────
  migrate:
    name: DB migrations → Supabase
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Supabase pooler uses a chain anchored at an internal CA that Node
      # doesn't ship. The migration script already sets ssl.rejectUnauthorized
      # to false, but pg v8 honours NODE_TLS_REJECT_UNAUTHORIZED in addition.
      # Matches the Railway runtime env. Acceptable for migrations that
      # connect through the encrypted pooler hostname.
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Verify DATABASE_URL secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret DATABASE_URL is empty or missing."
            echo "Set it under: GitHub repo → Settings → Secrets and variables → Actions → New repository secret."
            echo "Format: postgresql://postgres.<ref>:<password>@<region>.pooler.supabase.com:6543/postgres?sslmode=require"
            exit 1
          fi
          echo "DATABASE_URL secret is present (length=${#DATABASE_URL})."
      - run: pnpm install --no-frozen-lockfile
      - name: Run SQL migrations in order
        # Run from apps/api/ so the resolver finds the workspace-installed `pg`.
        # Tracks applied migrations in `_ci_applied_migrations` so the workflow
        # re-running on every push doesn't re-apply non-idempotent CREATEs.
        working-directory: apps/api
        run: |
          node -e "
          const { Client } = require('pg');
          const fs   = require('fs');
          const path = require('path');
          // Collect SQL files from both:
          //   - src/migrations/                       (legacy, single-folder)
          //   - src/modules/<feature>/migrations/     (modular per-module)
          // Sort globally by basename so timestamp prefix ordering still applies
          // across modules.
          function collect(root) {
            const out = [];
            for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
              const p = path.join(root, entry.name);
              if (entry.isDirectory()) out.push(...collect(p));
              else if (entry.isFile() && entry.name.endsWith('.sql')) out.push(p);
            }
            return out;
          }
          const all = [
            ...(fs.existsSync('src/migrations') ? collect('src/migrations') : []),
            ...(fs.existsSync('src/modules') ? collect('src/modules').filter(p => p.includes('/migrations/') || p.includes('\\\\migrations\\\\')) : []),
          ];
          // Sort by basename so 1715..._foo.sql ordering is preserved across folders.
          all.sort((a, b) => path.basename(a).localeCompare(path.basename(b)));
          const files = all.map(p => ({ name: path.basename(p), fullPath: p }));
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false } });
            await client.connect();

            await client.query(\`CREATE TABLE IF NOT EXISTS _ci_applied_migrations (
              file_name TEXT PRIMARY KEY,
              applied_at TIMESTAMPTZ NOT NULL DEFAULT now()
            )\`);

            const { rows: appliedRows } = await client.query('SELECT file_name FROM _ci_applied_migrations');
            const applied = new Set(appliedRows.map(r => r.file_name));

            let applied_now = 0, skipped = 0;
            for (const f of files) {
              if (applied.has(f.name)) { skipped++; continue; }
              console.log('Applying', f.name, '(from', f.fullPath + ')');
              const sql = fs.readFileSync(f.fullPath, 'utf8');
              try {
                await client.query('BEGIN');
                await client.query(sql);
                await client.query('INSERT INTO _ci_applied_migrations (file_name) VALUES (\$1) ON CONFLICT DO NOTHING', [f.name]);
                await client.query('COMMIT');
                applied_now++;
              } catch (err) {
                await client.query('ROLLBACK');
                // If the artifact already exists, mark the migration as applied
                // anyway — the schema reached the desired state out-of-band
                // (e.g. seeded manually) and re-running would never succeed.
                const msg = (err && err.message) || '';
                const reapplyable = /already exists|duplicate_object|duplicate key|extension .* is already/i.test(msg);
                if (reapplyable) {
                  console.log('  -> already present, marking as applied without re-running');
                  await client.query('INSERT INTO _ci_applied_migrations (file_name) VALUES (\$1) ON CONFLICT DO NOTHING', [f.name]);
                  applied_now++;
                } else {
                  console.error('FATAL migration', f.name, ':', msg);
                  throw err;
                }
              }
            }
            await client.end();
            console.log('Migrations done. applied=' + applied_now + ' skipped=' + skipped);
          })().catch(e => { console.error(e); process.exit(1); });
          "

  # NOTE: deploy-api and deploy-web jobs were removed on 2026-05-16.
  #
  # Railway runs its own GitHub auto-deploy on push to main (independent of
  # this workflow), so the CI deploy-api step was redundant and only added
  # noise by failing on missing RAILWAY_TOKEN.
  #
  # Vercel git integration is not currently enabled for the project (all
  # deployments shown as `source: cli`). Web deploys are produced from a
  # local machine via:
  #   cd apps/web
  #   pnpm build
  #   vercel build --prod
  #   vercel deploy --prebuilt --prod
  # See apps/api/scripts/verify-supabase-password.mjs sibling for context.
  #
  # If/when a real Personal Access Token (VERCEL_TOKEN) is provisioned and
  # added to repo secrets, the deploy-web job can be re-introduced:
  #   needs: migrate
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: pnpm/action-setup@v4
  #     - uses: actions/setup-node@v4
  #       with: { node-version: 24 }
  #     - run: pnpm install --no-frozen-lockfile
  #     - run: pnpm --filter @gravel/shared-types build
  #     - run: pnpm --filter @gravel/web build
  #     - run: npm install -g vercel@latest
  #     - working-directory: apps/web
  #       env: { VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }} }
  #       run: |
  #         vercel pull --yes --environment=production --token=$VERCEL_TOKEN
  #         vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
