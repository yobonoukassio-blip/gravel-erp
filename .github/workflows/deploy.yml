name: deploy
on:
  push:
    branches: [main]

jobs:
  # ── 1. Migrations Supabase ──────────────────────────────────────────────
  migrate:
    name: DB migrations → Supabase
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: pnpm install --no-frozen-lockfile
      - name: Run SQL migrations in order
        run: |
          node -e "
          const { Client } = require('pg');
          const fs   = require('fs');
          const path = require('path');
          const dir  = 'apps/api/src/migrations';
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.sql')).sort();
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false } });
            await client.connect();
            for (const f of files) {
              console.log('Running', f);
              await client.query(fs.readFileSync(path.join(dir, f), 'utf8'));
            }
            await client.end();
            console.log('All migrations done.');
          })().catch(e => { console.error(e); process.exit(1); });
          "

  # ── 2. Deploy API → Railway ────────────────────────────────────────────
  deploy-api:
    name: API → Railway
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service gravel-api --detach

  # ── 3. Deploy Web → Vercel ─────────────────────────────────────────────
  deploy-web:
    name: Web → Vercel
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install -g vercel@latest
      - name: Build & deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cd apps/web
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
