# Railway deployment config for @gravel/api (NestJS modular monolith)
# https://docs.railway.com/reference/config-as-code

[build]
builder = "NIXPACKS"
buildCommand = "cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @gravel/shared-types build && pnpm --filter @gravel/api build"

[deploy]
# Apply pending SQL migrations from src/migrations/ AND src/modules/*/migrations/
# before booting the API so the schema always matches the entity definitions.
# Migration runner is idempotent (tracked in `_migrations` table).
startCommand = "node scripts/run-migrations.mjs && node dist/src/main.js"
healthcheckPath = "/health/live"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
