name: gravel_mobile
description: Gravel Ivoire ERP — Flutter 3.35 Android-first field-entry app.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

  # State management — Riverpod (D-34)
  flutter_riverpod: ^2.5.0

  # Offline-first sync (D-10)
  powersync: ^1.9.0
  drift: ^2.20.0
  drift_sqlite_async: ^0.2.0
  sqlite_async: ^0.13.0

  # Auth — OIDC native flow (D-36)
  flutter_appauth: ^7.0.0
  flutter_secure_storage: ^9.2.0

  # HTTP client for non-sync calls (file upload, signed URL fetch)
  dio: ^5.7.0
  path_provider: ^2.1.0

  cupertino_icons: ^1.0.8
  uuid: ^4.5.0

  # Crypto — SHA-256 for weighing ticket content_hash (TRP-02 / ADR-0009)
  # and signature blob hashing.
  crypto: ^3.0.5

  # Signature capture (TRP-02). PNG export → SHA-256 hashed.
  signature: ^5.5.0

  # OpenTelemetry Dart SDK — D-37. Exports OTLP/HTTP to Grafana LGTM
  # collector; W3C traceparent propagation via Dio interceptor.
  opentelemetry: ^0.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
  generate: true
