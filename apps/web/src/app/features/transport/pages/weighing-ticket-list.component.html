<!--
  Weighing ticket read-only list (TRP-02).
  is_offline_generated rendered as a badge in the AG-Grid column cell renderer.
-->
<div class="weighing-ticket-list">
  <header class="toolbar">
    <h1>{{ 'transport.weighing_ticket_list_title' | transloco }}</h1>
    <span>is_offline_generated badge shown per row</span>
  </header>
  <ag-grid-angular
    class="ag-theme-material"
    style="width: 100%; height: 600px"
    [rowData]="rows()"
    [columnDefs]="columnDefs"
  />
</div>
