apiVersion: v2
name: gravel-lgtm
description: |
  Gravel Ivoire ERP — Phase-1 observability stack (Grafana LGTM).
  Composes Loki, Grafana, Tempo, Mimir and the OpenTelemetry Collector
  as a single deployable unit. Single-AZ for Phase 1 (D-37); multi-AZ
  deferred to Phase 6 alongside DB-per-tenant (ADR-0005).
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - observability
  - opentelemetry
  - grafana
  - loki
  - tempo
  - mimir
maintainers:
  - name: Gravel Phase 1 Planner
    email: ops@gravel-ivoire.example
dependencies:
  # Versions pinned per D-37 (Grafana 11, Loki 3, Tempo 2.5, Mimir 2.13).
  - name: grafana
    version: "8.5.x"
    repository: https://grafana.github.io/helm-charts
  - name: loki
    version: "6.x.x"
    repository: https://grafana.github.io/helm-charts
    alias: loki
  - name: tempo-distributed
    version: "1.x.x"
    repository: https://grafana.github.io/helm-charts
    alias: tempo
  - name: mimir-distributed
    version: "5.x.x"
    repository: https://grafana.github.io/helm-charts
    alias: mimir
  - name: opentelemetry-collector
    version: "0.108.x"
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    alias: otelCollector
