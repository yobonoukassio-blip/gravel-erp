# Grafana LGTM stack — Phase 1 values.
# Single-AZ Phase 1 (D-37). Adjust replica counts + storage class when
# graduating to multi-AZ (deferred; see ADR-0005).

global:
  clusterDomain: cluster.local

# -----------------------------------------------------------------------------
# Grafana — dashboards + datasources auto-provisioned via ConfigMaps.
# -----------------------------------------------------------------------------
grafana:
  image:
    tag: "11.3.0"
  adminPassword: "change-me-at-deploy"
  persistence:
    enabled: true
    size: 10Gi
  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "true"
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "true"
      folder: /var/lib/grafana/dashboards
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# -----------------------------------------------------------------------------
# Loki — logs ingestion. Phase 1: single-binary mode (D-37).
# -----------------------------------------------------------------------------
loki:
  loki:
    image:
      tag: "3.2.0"
    auth_enabled: false
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 50Gi
  read:  { replicas: 0 }
  write: { replicas: 0 }
  backend: { replicas: 0 }

# -----------------------------------------------------------------------------
# Tempo — distributed traces. Phase 1: minimal replica counts.
# -----------------------------------------------------------------------------
tempo:
  image:
    tag: "2.5.0"
  global_overrides:
    metrics_generator_processors: [service-graphs, span-metrics]
  ingester:
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
  distributor:
    replicas: 1
  querier:
    replicas: 1
  queryFrontend:
    replicas: 1
  compactor:
    replicas: 1

# -----------------------------------------------------------------------------
# Mimir — metrics. Phase 1: minimal replicas, blocks storage on filesystem.
# -----------------------------------------------------------------------------
mimir:
  image:
    tag: "2.13.0"
  ingester:
    replicas: 1
    persistentVolume:
      enabled: true
      size: 20Gi
  distributor:
    replicas: 1
  querier:
    replicas: 1
  store_gateway:
    replicas: 1
  compactor:
    replicas: 1
  minio:
    enabled: true

# -----------------------------------------------------------------------------
# OpenTelemetry Collector — OTLP/gRPC + OTLP/HTTP ingress for api/web/mobile.
# Routes traces→tempo, logs→loki, metrics→mimir.
# -----------------------------------------------------------------------------
otelCollector:
  mode: deployment
  image:
    tag: "0.108.0"
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
            cors:
              # Web SDK posts from the browser — allow origin must include the
              # admin UI. Tighten to the actual prod origin at deploy-time.
              allowed_origins: ["*"]
    processors:
      batch:
        timeout: 5s
        send_batch_size: 1024
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      # Drop attributes that may contain PII or money values — defense-in-depth
      # in case an instrumentation regresses.
      attributes/scrub:
        actions:
          - key: http.request.body
            action: delete
          - key: http.response.body
            action: delete
          - key: db.statement.parameters
            action: delete
    exporters:
      otlphttp/loki:
        endpoint: http://gravel-lgtm-loki-gateway.observability.svc.cluster.local/otlp
      otlp/tempo:
        endpoint: gravel-lgtm-tempo-distributor.observability.svc.cluster.local:4317
        tls: { insecure: true }
      otlphttp/mimir:
        endpoint: http://gravel-lgtm-mimir-nginx.observability.svc.cluster.local/otlp
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, attributes/scrub, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/mimir]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, attributes/scrub, batch]
          exporters: [otlphttp/loki]
  service:
    type: ClusterIP
  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
