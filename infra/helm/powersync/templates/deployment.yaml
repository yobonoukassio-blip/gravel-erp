apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-powersync
  labels:
    app.kubernetes.io/name: powersync
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: powersync
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: powersync
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: powersync
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKey }}
            {{- range .Values.env }}
            - name: {{ .name }}
              value: "{{ .value }}"
            {{- end }}
          volumeMounts:
            - name: sync-rules
              mountPath: /etc/powersync
              readOnly: true
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: sync-rules
          configMap:
            name: {{ .Values.syncRules.existingConfigMap }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-powersync
  labels:
    app.kubernetes.io/name: powersync
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: powersync
    app.kubernetes.io/instance: {{ .Release.Name }}
