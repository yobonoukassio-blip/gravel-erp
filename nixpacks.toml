# Nixpacks config — contrôle la phase install pour éviter le double pnpm install
# La phase build est gérée par Railway UI (Custom Build Command)

[phases.install]
# Install phase : NODE_ENV=development pour inclure devDeps (TypeScript, NestJS CLI...)
cmds = [
  "npm install -g corepack@0.24.1 && corepack enable",
  "NODE_ENV=development pnpm install"
]
